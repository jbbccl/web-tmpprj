# tmpprj —— FastAPI + Vue/Vite + MariaDB，用 Podman 跑
#
#   podman-compose up -d            # 起全部
#   podman-compose up -d db         # 只起数据库
#   podman-compose logs -f backend  # 看日志
#   podman-compose down             # 停（数据留存在 dbdata 卷里）
#   podman-compose down -v          # 停并删数据卷
#
# 密码/端口放在 .env
# 注意 podman-compose  ${VAR}、${VAR:-默认}、${VAR-默认}、${VAR:?报错}，

services:
  db:
    image: docker.io/library/mariadb:11
    container_name: tmpprj-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootpass}"
      MARIADB_DATABASE: "${DB_NAME:-dbtmp}"
      MARIADB_USER: "${DB_USER:-dbtmp}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set - cp .env.example .env}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: tmpprj-backend
    restart: unless-stopped
    depends_on:
      db:
        # 用 db 的 healthcheck 卡住，等它真能连了再起 backend。
        condition: service_healthy
    environment:
      SQL_ADDR: "db"
      SQL_PORT: "3306"
      SQL_USER: "${DB_USER:-dbtmp}"
      SQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set - cp .env.example .env}"
      SQL_DB: "${DB_NAME:-dbtmp}"
      PYTHONUNBUFFERED: "1"
    volumes:
      # 依赖装在 ./backend/.venv
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8001}:8001"

  frontend:
    build:
      context: ./frontend
    container_name: tmpprj-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: "http://backend:8001"
    volumes:
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-5509}:5509"

volumes:
  dbdata:
